# No deja una línea en blanco entre comandos
add_newline = false

format = "$directory$git_branch$git_status$python$nodejs$docker_context$cmd_duration$character "

[directory]
style = "bold cyan"
truncate_to_repo = true
truncation_length = 3
read_only = " "

[git_branch]
symbol = "🌿 "
style = "bold purple"

[git_status]
style = "bold red"

[python]
symbol = "🐍 "
style = "yellow"

[nodejs]
symbol = "🟢 "
style = "green"

[docker_context]
symbol = "🐳 "
style = "blue"

[cmd_duration]
min_time = 1000
format = "⏱ [$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"